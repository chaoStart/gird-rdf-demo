<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>配电网 · 本体与推理</title>
<style>
:root{font:15px system-ui;color:#daedef;background:#0c1722}*{box-sizing:border-box}body{margin:0;padding:30px;max-width:1440px;margin-inline:auto}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin-bottom:5px}h2{font-size:18px}p{color:#9fb4c4;line-height:1.7}.pill{border:1px solid #355361;border-radius:30px;padding:8px 14px;color:#7ae4ca}main{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:24px}.card{background:#142333;border:1px solid #294052;border-radius:15px;padding:22px}.wide{grid-column:1/-1}button,select,input{font:inherit;border:1px solid #3c566c;background:#1a3448;color:#e2f4fb;border-radius:8px;padding:10px;margin:3px}button{cursor:pointer}button:hover{background:#27516a}button.primary{background:#127c70}svg{width:100%;height:360px;background:#101e2c;border-radius:10px}text{font:13px system-ui;fill:#cfe6ed}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats span{background:#10212d;border-radius:10px;padding:15px;min-width:110px}.stats strong{display:block;color:#69dfc5;font-size:27px}.error{color:#ff9d94}pre{white-space:pre-wrap;font-size:12px;color:#a9c3d2;max-height:230px;overflow:auto}#answer{line-height:1.8;white-space:pre-wrap}label{display:block;margin-block:10px}#rules{line-height:1.8;max-height:280px;overflow:auto}form{display:flex}input{min-width:0;flex:1}@media(max-width:850px){body{padding:16px}main{grid-template-columns:1fr}header{display:block}.card{padding:14px}}
</style>
<header><div><p>ONTOLOGY / DISTRIBUTION GRID</p><h1>配电网本体与知识推理</h1><p>模拟网络 · 可解释推理 · 场景沙盘</p></div><span class="pill" id="health">正在连接…</span></header>
<main><section class="card"><h2>设备拓扑与供电状态</h2><p>青色为带电设备，红色为失电设备。开关状态仅在本次分析生效。</p><svg id="network" viewBox="0 0 700 360" role="img" aria-label="配电网设备拓扑"></svg><div class="stats" id="stats"></div></section>
<section class="card"><h2>场景设置</h2><label>S1 分段开关 <select id="s1"><option value="closed">闭合</option><option value="open">断开</option></select></label><label>L1 联络开关 <select id="l1"><option value="open">断开</option><option value="closed">闭合</option></select></label><button class="primary" id="analyze">分析失电影响</button><button id="transfer">评估 X → Y 转供</button><p id="summary"></p><pre id="detail"></pre></section>
<section class="card wide"><h2>对话推理</h2><p>确定性工具路由 Demo：支持失电影响、过载、备用转供及规则查询；未接入大语言模型。</p><button data-q="S1断开后哪些用户失电？">S1 断开影响哪些用户？</button><button data-q="哪些配变过载？">哪些配变过载？</button><button data-q="S1断开后能否转供到备用馈线？">能否转供？</button><form id="chat"><input id="question" aria-label="问题" placeholder="输入配电网问题" required maxlength="500"><button class="primary">发送</button></form><p id="answer" aria-live="polite"></p><details><summary>查看推理证据</summary><pre id="evidence"></pre></details></section>
<section class="card"><h2>本体类与继承</h2><svg id="ontology" viewBox="0 0 680 1050" style="height:600px" role="img" aria-label="本体类继承关系图"></svg><details><summary>查看类清单</summary><div id="classes"></div></details></section><section class="card"><h2>规则目录</h2><div id="rules"></div></section><footer class="wide"><p>仅为静态模拟：转供结果只含拓扑与容量初筛，未进行潮流、电压、载流量、保护配合和调度校验，不构成操作指令。</p></footer></main>
<script>
const $=id=>document.getElementById(id);let model,current;const ns='http://www.w3.org/2000/svg';
async function api(path,body){const r=await fetch('/api/'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const data=await r.json();if(!r.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));return data}
function scenario(){return{states:{S1:$('s1').value,L1:$('l1').value},blocked:[]}}
function elem(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e}
function draw(){const svg=$('network');svg.replaceChildren();const fixed={X:[70,85],S1:[200,85],A:[340,85],B:[490,85],Y:[70,245],L1:[340,245],C:[200,300],U1:[340,25],U2:[610,85],U3:[300,330]};const positions={};model.nodes.forEach((n,i)=>positions[n.id]=fixed[n.id]||[60+(i%5)*130,60+Math.floor(i/5)*110]);for(const e of model.edges){const a=positions[e.source],b=positions[e.target];if(a&&b)svg.append(elem('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:e.relation==='supplies'?'#536b86':'#467d86','stroke-width':2,'stroke-dasharray':e.relation==='supplies'?'4 4':'none'}))}for(const n of model.nodes){const[x,y]=positions[n.id];const isCustomer=n.types.includes('Customer');const live=isCustomer?!current.outage_customers.includes(n.id):current.energized.includes(n.id);svg.append(elem('circle',{cx:x,cy:y,r:16,fill:live?'#29b89e':'#c66867'}));svg.append(elem('text',{x,y:y+33,'text-anchor':'middle'},n.label));if(['S1','L1'].includes(n.id))svg.append(elem('text',{x,y:y-25,'text-anchor':'middle'},scenario().states[n.id]))}}
function showStats(){const box=$('stats');box.replaceChildren();for(const[value,label]of [[current.outage_transformers.length,'失电配变'],[current.households,'受影响户数'],[current.overloads.length,'过载配变']]){const s=document.createElement('span'),b=document.createElement('strong');b.textContent=value;s.append(b,document.createTextNode(label));box.append(s)}}
function drawOntology(){const svg=$('ontology'),pos={};const depth=c=>{const e=model.hierarchy.find(e=>e.source===c);return e?1+depth(e.target):0};const levels={};for(const c of model.classes){const d=depth(c);(levels[d]??=[]).push(c)};for(const[d,items]of Object.entries(levels)){items.forEach((c,i)=>pos[c]=[30+Number(d)*160,35+i*65])};const max=Math.max(...Object.values(levels).map(x=>x.length))*65+40;svg.setAttribute('viewBox',`0 0 ${Math.max(...Object.keys(levels).map(Number))*160+210} ${max}`);for(const e of model.hierarchy){const a=pos[e.source],b=pos[e.target];svg.append(elem('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'#386373'}))}for(const[c,[x,y]]of Object.entries(pos)){svg.append(elem('rect',{x:x-4,y:y-14,width:155,height:28,rx:5,fill:'#193d50'}));svg.append(elem('text',{x,y:y+4,style:'font-size:10px'},c))}}
async function analyze(){try{current=await api('analyze',scenario());draw();showStats();$('summary').textContent=current.evidence.join('；');$('detail').textContent=JSON.stringify(current,null,2)}catch(e){$('summary').textContent=e.message}}
$('analyze').onclick=analyze;$('transfer').onclick=async()=>{try{const r=await api('transfer',scenario());$('summary').textContent=(r.screening_passed?'初筛通过，仍需工程校验':'初筛未通过：'+r.reasons.join('；'))+'。'+r.limitation;$('detail').textContent=JSON.stringify(r,null,2)}catch(e){$('summary').textContent=e.message}};
async function ask(q){$('answer').textContent='正在分析…';try{const r=await api('chat',{...scenario(),question:q});$('answer').textContent=r.answer;$('evidence').textContent=JSON.stringify(r.evidence||{},null,2)}catch(e){$('answer').textContent=e.message}}
$('chat').onsubmit=e=>{e.preventDefault();ask($('question').value)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q));
(async()=>{try{const h=await api('health');$('health').textContent=h.backend==='local'?'本地模拟数据':h.backend==='neo4j'?'Neo4j 快照':'SPARQL 快照';model=await api('model');const list=$('classes');for(const c of model.classes){const row=document.createElement('p');const p=model.hierarchy.find(e=>e.source===c);row.textContent=c+(p?' → '+p.target:'');list.append(row)}drawOntology();for(const r of model.rules){const p=document.createElement('div');p.textContent=`${r.id} · ${r.description} (${r.engine})`;$('rules').append(p)}await analyze()}catch(e){$('health').textContent='连接失败';$('summary').textContent=e.message}})();
</script></html>
